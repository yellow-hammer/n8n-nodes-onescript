# Выпуск версии: workflow_dispatch с именем тега v* или пуш такого тега.
# Проставляет версию, собирает CHANGELOG через git-cliff, создаёт страницу релиза и публикует npm.
name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Имя тега, например v0.2.0 или v0.2.0-rc.1'
        required: true
        type: string
      draft:
        description: 'Черновик страницы релиза'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Предварительный релиз'
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Получить код
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Определить версию
        id: ver
        env:
          RAW_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
        run: |
          RAW="${RAW_VERSION#v}"
          if ! printf '%s' "$RAW" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Неверное имя тега. Нужен вид v1.2.3 или v1.2.3-rc.1"
            exit 1
          fi
          echo "version=$RAW" >> "$GITHUB_OUTPUT"
          echo "tag=v$RAW" >> "$GITHUB_OUTPUT"
          echo "Версия: v$RAW"

      - name: Проставить версию
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version
          git add package.json package-lock.json
          if git diff --staged --quiet; then
            echo "Версия уже совпадает"
          else
            git commit -m "chore(release): подготовили v${{ steps.ver.outputs.version }}"
            git push origin main
          fi

      - name: Установить Rust toolchain
        if: github.event_name == 'workflow_dispatch'
        uses: dtolnay/rust-toolchain@stable

      - name: Кэшировать cargo
        if: github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-git-cliff
          restore-keys: |
            ${{ runner.os }}-cargo-git-cliff-

      - name: Установить git-cliff
        if: github.event_name == 'workflow_dispatch'
        run: |
          if ! command -v git-cliff >/dev/null 2>&1; then
            cargo install git-cliff --locked
          fi
          git-cliff --version

      - name: Сгенерировать CHANGELOG
        if: github.event_name == 'workflow_dispatch'
        id: changelog
        run: |
          git-cliff --config cliff.toml --tag "v${{ steps.ver.outputs.version }}" --output CHANGELOG.md

          CHANGELOG=$(awk '
            /^## \[/ {
              if (found) exit
              found = 1
            }
            found { print }
          ' CHANGELOG.md)

          CHANGELOG=$(printf '%s\n' "$CHANGELOG" | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}')

          if printf '%s\n' "$CHANGELOG" | head -n 1 | grep -q 'Unreleased'; then
            CHANGELOG=""
          fi

          if [ -z "$CHANGELOG" ] || [ "${#CHANGELOG}" -lt 20 ]; then
            CHANGELOG="## Изменения"$'\n\n'"См. коммиты тега v${{ steps.ver.outputs.version }}."
          fi

          {
            echo 'changelog<<EOF'
            printf '%s\n' "$CHANGELOG"
            echo EOF
          } >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Закоммитить CHANGELOG
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add CHANGELOG.md
          if git diff --staged --quiet; then
            echo "Журнал без изменений"
          else
            git commit -m "chore(release): обновили журнал изменений"
            git push origin main
          fi

      - name: Создать и отправить тег
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          git fetch origin --tags
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Тег $TAG уже есть"
          else
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git tag -a "$TAG" -m "chore(release): выпустили $TAG"
            git push origin "$TAG"
          fi

      - name: Опубликовать в npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          if npm view "n8n-nodes-onescript@${VERSION}" version >/dev/null 2>&1; then
            echo "Версия ${VERSION} уже опубликована"
            exit 0
          fi
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          npm run release

      - name: Создать страницу релиза
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}

      - name: Создать страницу релиза по тегу
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Страница релиза уже есть"
            exit 0
          fi
          git fetch origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes-from-tag --title "$GITHUB_REF_NAME"
